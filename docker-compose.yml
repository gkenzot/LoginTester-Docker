# ========================================
# LoginTester - Configuração Unificada
# Funciona tanto localmente (HTTP) quanto externamente (HTTPS via ngrok)
# ========================================

services:
  # ========================
  # DATABASE (PostgreSQL)
  # ========================
  database:
    image: postgres:16
    container_name: logintester_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logintester_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logintester_password}
      POSTGRES_DB: ${POSTGRES_DB:-logintester_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../LoginTester-DB/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../LoginTester-DB/dev-data.sql:/docker-entrypoint-initdb.d/02-data.sql
    networks:
      - logintester_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logintester_admin} -d ${POSTGRES_DB:-logintester_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================
  # REDIS (Rate Limiting)
  # ========================
  redis:
    image: redis:7-alpine
    container_name: logintester_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - logintester_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ========================
  # BACKEND (Spring Boot) - HTTP apenas
  # ========================
  backend:
    build:
      context: ../LoginTester-BackEnd
      dockerfile: Dockerfile
    container_name: logintester_backend
    environment:
      # Database connection
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-logintester_db}
      DB_USERNAME: ${POSTGRES_USER:-logintester_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-logintester_password}
      
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      
      # Server Configuration
      PORT: 8080
      
      # CORS Configuration - aceita localhost e domínios externos
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost,https://localhost}
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      
      # Email Configuration (SMTP Google)
      GMAIL_USERNAME: ${GMAIL_USERNAME:-ktakeapps@gmail.com}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-jalh nhmi vnzk bszz}
      EMAIL_FROM: ${EMAIL_FROM:-ktakeapps@gmail.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      
      # Java Options
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - logintester_network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ========================
  # FRONTEND (React + Vite) - HTTP apenas
  # ========================
  frontend:
    build:
      context: ../LoginTester-FrontEnd
      dockerfile: Dockerfile
    container_name: logintester_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_APP_NAME: ${VITE_APP_NAME:-LoginTester}
      VITE_ENVIRONMENT: unified
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - logintester_network
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # ========================
  # NGINX (Proxy Reverso) - HTTP apenas
  # ========================
  nginx:
    image: nginx:alpine
    container_name: logintester_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx-simple.conf:/etc/nginx/nginx.conf:ro
    networks:
      - logintester_network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ========================
# VOLUMES
# ========================
volumes:
  postgres_data:
    name: logintester_postgres_data
    driver: local
  redis_data:
    name: logintester_redis_data
    driver: local

# ========================
# NETWORKS
# ========================
networks:
  logintester_network:
    name: logintester_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
